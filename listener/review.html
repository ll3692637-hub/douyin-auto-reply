<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播复盘 - LiveRoomListener</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #333; font-size: 14px; }
  header { background: #1a1d23; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: #9aa0aa; }
  .layout { display: flex; height: calc(100vh - 52px); }
  aside { width: 300px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; }
  aside h2 { font-size: 13px; color: #666; padding: 12px 14px 6px; }
  .sess { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .sess:hover { background: #f8fafc; }
  .sess.active { background: #eef4ff; border-left: 3px solid #2196F3; }
  .sess .id { font-size: 12px; color: #999; font-family: monospace; }
  .sess .meta { font-size: 12px; color: #666; margin-top: 4px; }
  .sess .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; margin-right: 5px; }
  main { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .card { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  /* TASK-UI-003v2：圆滑苹果风 */
  .tl-controls button { border-radius: 10px; }
  .tl-controls input[type="text"] { border-radius: 10px; }
  .seg-toggle { border-radius: 10px !important; }
  #tlCanvas { border-radius: 12px; }
  .tl-ev { border-radius: 10px; }
  .search-match { border-radius: 8px; }
  .card h3 { font-size: 14px; margin-bottom: 10px; }
  .kv { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: #555; }
  .kv b { color: #222; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 1px; }
  .b-mock { background: #fff3e0; color: #e65100; }
  .b-err { background: #ffebee; color: #c62828; }
  .b-empty { background: #f5f5f5; color: #999; }
  .b-anchor { background: #e3f2fd; color: #1565c0; }
  .b-water { background: #f3e5f5; color: #7b1fa2; }
  .b-profile { background: #e8f5e9; color: #2e7d32; }
  .tl-item { padding: 9px 0; border-bottom: 1px solid #f2f2f2; display: flex; gap: 12px; }
  .tl-item:last-child { border-bottom: none; }
  .t { flex: 0 0 52px; font-size: 12px; color: #999; font-family: monospace; padding-top: 2px; }
  .tl-item .body { flex: 1; }
  .tr-text { font-size: 14px; line-height: 1.6; }
  .tr-norm { font-size: 12px; color: #2e7d32; margin-top: 4px; }
  .dm-user { font-size: 12px; color: #666; }
  .dm-text { font-size: 14px; margin-top: 2px; }
  .nodata { color: #bbb; font-size: 13px; }
  .empty-tip { text-align: center; color: #bbb; padding: 60px 0; }
  .toolbar { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .toolbar label { font-size: 12px; color: #666; }
  .toolbar select { font-size: 12px; padding: 4px 8px; }
  /* TASK-UI-002：左侧导航 */
  .nav-btn { flex: 1; padding: 8px 4px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; color: #555; }
  .nav-btn.active { background: #2196F3; border-color: #2196F3; color: #fff; font-weight: 600; }
  .sess-title { font-size: 14px; font-weight: 600; color: #333; }
  .sess-sub { font-size: 12px; color: #999; margin-top: 3px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f44336; margin-right: 6px; animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  /* TASK-UI-003：时间轴总览 */
  #tlCanvas { width: 100%; display: block; border: 1px solid #eee; border-radius: 8px; background: #fafbfc; }
  .tl-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
  .tl-controls button { padding: 5px 12px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
  .tl-controls button.active { background: #2196F3; border-color: #2196F3; color: #fff; }
  .tl-controls input[type="text"] { padding: 5px 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; width: 160px; }
  .tl-hint { font-size: 11px; color: #999; }
  .tl-detail { display: flex; gap: 16px; margin-top: 12px; }
  .tl-left { flex: 1.2; min-width: 0; }
  .tl-right { flex: 1; min-width: 0; }
  .tl-detail h4 { margin: 12px 0 6px; font-size: 14px; }
  .tl-detail h4:first-child { margin-top: 0; }
  .tl-ev { max-height: 480px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 6px; padding: 8px; }
  .tl-more { text-align: center; padding: 8px; }
  .tl-more button { font-size: 12px; padding: 4px 16px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
  .shot-thumb { display: inline-block; margin: 0 8px 8px 0; cursor: zoom-in; vertical-align: top; }
  .shot-thumb img { max-width: 180px; border-radius: 6px; border: 1px solid #eee; }
  #shotLightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; z-index: 999; align-items: center; justify-content: center; flex-direction: column; }
  #shotLightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; }
  #shotLightbox button { margin-top: 12px; padding: 8px 24px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; }
  .search-match { padding: 6px 8px; border-bottom: 1px solid #f5f5f5; cursor: pointer; font-size: 13px; }
  .search-match:hover { background: #f0f7ff; }
  .search-match .t { color: #999; font-size: 11px; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>🎙️ 直播复盘</h1>
  <span class="sub">LiveRoomListener · 本机数据 · 不上传</span>
</header>
<div id="svcBanner" style="display:none;background:#fff3e0;color:#8d4e00;padding:10px 16px;font-size:13px;border-bottom:1px solid #ffe0b2">
  ⚠️ 本地服务未启动 → 请在 listener 目录运行 <b>npm start</b>，然后刷新本页。
</div>
<div class="layout">
  <aside>
    <nav id="mainNav" style="display:flex;gap:6px;margin-bottom:12px">
      <button data-nav="review" class="nav-btn active">📺 直播复盘</button>
      <button data-nav="storage" class="nav-btn">💾 存储管理</button>
      <button data-nav="diag" class="nav-btn" title="仅排查问题时使用">🔧 诊断工具</button>
    </nav>
    <div id="navContext">
      <div id="ctxReview">
        <div id="sessList"><div class="empty-tip">加载中…</div></div>
      </div>
      <div id="ctxStorage" style="display:none">
        <div style="font-size:12px;color:#999;line-height:1.6">查看本机占用、清理截图与旧会话。<br>点上方"💾 存储管理"进入。</div>
      </div>
      <div id="ctxDiag" style="display:none">
        <div style="font-size:11px;color:#999;margin-bottom:6px">仅排查问题时使用</div>
        <div id="diagList"><div class="empty-tip">暂无诊断报告</div></div>
      </div>
    </div>
  </aside>
  <main id="main">
    <div class="empty-tip">← 选择一场会话查看复盘</div>
  </main>
</div>
<script src="/segment.js"></script>
<script src="/timeline.js"></script>
<script>
const $ = id => document.getElementById(id);
let showKind = "all"; // all | transcript | danmaku
let viewMode = "overview"; // overview | timeline（TASK-UI-003：默认时间轴总览）

function fmtMs(ms) {
  const s = Math.floor((ms || 0) / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function fmtTime(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  return d.toLocaleString("zh-CN", { hour12: false });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// TASK-UI-002：人性化时间标题，如"10月11日 19:30"
function fmtDateTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// TASK-UI-002：左侧三导航
let currentNav = "review";
let currentSessionId = null;
function switchNav(nav) {
  currentNav = nav;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.nav === nav));
  $("ctxReview").style.display = nav === "review" ? "block" : "none";
  $("ctxStorage").style.display = nav === "storage" ? "block" : "none";
  $("ctxDiag").style.display = nav === "diag" ? "block" : "none";
  if (nav === "storage") showStorage();
  if (nav === "review" && currentSessionId) loadDetail(currentSessionId); // 切回时恢复当前场次
}

let autoSelected = false;

async function loadSessions() {
  try {
    const r = await fetch("/api/sessions");
    const data = await r.json();
    const list = data.sessions || [];
    $("svcBanner").style.display = "none";
    if (!list.length) {
      $("sessList").innerHTML = '<div class="empty-tip">还没有直播记录。<br>打开插件弹窗，点「开始监听」。📺</div>';
      return;
    }
    $("sessList").innerHTML = list.map(s => {
      const active = !s.endTime;
      const title = active
        ? `<span class="live-dot"></span>正在直播`
        : `${esc(fmtDateTime(s.startTime))} 的直播`;
      const dur = (s.startTime && s.endTime) ? fmtDur(s.endTime - s.startTime) : (active ? "进行中" : "—");
      const sub = `${dur} · 转写 ${s.transcriptCount} · 弹幕 ${s.danmakuCount} · 换品 ${s.productCount || 0} · 截图 ${s.visualCount || 0}`;
      return `
      <div class="sess" data-id="${esc(s.sessionId)}">
        <div class="sess-title">${title}
          ${s.endTime ? `<span class="sess-del" data-del="${esc(s.sessionId)}" title="删除会话"
            style="float:right;color:#ccc;cursor:pointer;font-size:14px">✕</span>` : ""}</div>
        <div class="sess-sub">${esc(sub)}</div>
      </div>`;
    }).join("");
    document.querySelectorAll(".sess").forEach(el => {
      el.addEventListener("click", (ev) => {
        if (ev.target.dataset.del) { deleteSession(ev.target.dataset.del); return; }
        document.querySelectorAll(".sess").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        currentSessionId = el.dataset.id;
        loadDetail(el.dataset.id);
      });
    });
    // AC-UI2-02：进站自动进入最新场次
    if (!autoSelected && list.length) {
      autoSelected = true;
      const first = document.querySelector(".sess");
      if (first) { first.classList.add("active"); currentSessionId = first.dataset.id; loadDetail(first.dataset.id); }
    }
  } catch (e) {
    $("sessList").innerHTML = '<div class="empty-tip">服务未连接</div>';
    $("svcBanner").style.display = "block";
  }
}

function renderTranscript(t) {
  let badges = "";
  if (t.mock) badges += '<span class="badge b-mock">MOCK</span>';
  if (t.status === "error") badges += '<span class="badge b-err">转写失败</span>';
  if (t.status === "empty") badges += '<span class="badge b-empty">空转写</span>';
  let body = `<div class="tr-text">${esc(t.text) || '<span class="nodata">（无文本）</span>'}</div>`;
  if (t.normText && t.normText !== t.text) {
    body += `<div class="tr-norm">清洗后：${esc(t.normText)}</div>`;
  }
  if (t.error) body += `<div style="font-size:12px;color:#c62828;margin-top:4px">${esc(t.error)}</div>`;
  return `<div class="t">${fmtMs(t.offsetMs)}</div><div class="body">${body}${badges}</div>`;
}

function renderDanmaku(d) {
  let badge = "";
  if (d.role === "anchor") badge = '<span class="badge b-anchor">主播号</span>';
  else if (d.role === "water_army") badge = '<span class="badge b-water">水军</span>';
  return `<div class="t">${fmtMs(d.offsetMs)}</div><div class="body">
    <div class="dm-user">${esc(d.userName || "观众")}${badge}</div>
    <div class="dm-text">${esc(d.text)}</div></div>`;
}

// TASK-VISUAL-TREND-001：画面/趋势条目
// netChange 由调用方传入（相对上一快照的在线显示净变化），null 则不显示
function renderVisual(v, sessionId, netChange) {
  const file = v.framePath ? v.framePath.split("/").pop() : null;
  // TASK-STORAGE-001：已清理的截图显示"截图已清理"，不留失效路径
  const img = v.frameCleared
    ? `<span class="nodata">截图已清理</span>`
    : (file
      ? `<img src="/api/frame?sessionId=${encodeURIComponent(sessionId)}&file=${encodeURIComponent(file)}"
           loading="lazy" style="max-width:280px;border-radius:6px;border:1px solid #eee" alt="画面截图">`
      : `<span class="nodata">无截图${v.frameError ? "（" + esc(v.frameError) + "）" : ""}</span>`);
  const m = v.metrics || {};
  const rm = v.rawMetrics || {};
  let metricLine = "";
  if (m.online != null) {
    metricLine = `在线 <b>${m.online}</b>`;
    if (netChange != null) {
      const sign = netChange > 0 ? "+" : "";
      metricLine += `（较上次 ${sign}${netChange}）`;
    }
    if (rm.online) metricLine += ` <span style="color:#999;font-size:12px">页面原文：${esc(rm.online)}</span>`;
  } else {
    metricLine = `<span class="nodata">在线数：暂无数据${rm.online ? "（原文：" + esc(rm.online) + "）" : ""}</span>`;
  }
  return `<div class="t">${fmtMs(v.offsetMs)}</div><div class="body">
    ${img}<div style="margin-top:6px;font-size:13px">${metricLine}</div></div>`;
}

// 时间轴统一渲染入口
function renderItem(x, sessionId) {
  if (x.kind === "transcript") return renderTranscript(x.data);
  if (x.kind === "danmaku") return renderDanmaku(x.data);
  if (x.kind === "visual") return renderVisual(x.data, sessionId, x._delta);
  if (x.kind === "product") return renderProduct(x.data);
  return "";
}

// TASK-PRODUCT-001 修订版：换品 / 价格更新节点（优先原样显示 priceText，不强行加 ¥）
function renderProduct(p) {
  const prod = p.product || {};
  const isSwitch = p.type !== "price_update";
  const badge = isSwitch
    ? '<span class="badge" style="background:#e8f5e9;color:#2e7d32">换品</span>'
    : '<span class="badge" style="background:#e3f2fd;color:#1565c0">价格更新</span>';
  const priceLabel = prod.priceText ? esc(prod.priceText)
    : (prod.price ? "¥" + esc(prod.price) : "");
  return `<div class="t">${fmtMs(p.offsetMs)}</div><div class="body">
    ${badge}
    <b>${esc(prod.name || "未知商品")}</b>
    ${priceLabel ? `｜${priceLabel}` : ""}
    <span style="color:#999;font-size:12px">｜来源：${esc(prod.source || "讲解商品卡")}</span></div>`;
}

// TASK-SEGMENT-001：按换品节点分段复盘（无 AI 判断、无评价、无因果推断）
function segPriceLabel(prod) {
  prod = prod || {};
  return prod.priceText ? prod.priceText : (prod.price ? "¥" + prod.price : "");
}

function renderSegments(tlWithDelta, info, sessionId) {
  const segs = LiveSegments.buildSegments(
    tlWithDelta.map(x => ({ kind: x.kind, at: x.at, data: x.data, _delta: x._delta })),
    info
  );
  // 补丁：片段边界为系统首次识别到换品的时间，不可声称是主播实际换品的精确时刻；
  // 卡片短暂消失不结束片段。
  const note = `<div style="font-size:11px;color:#999;margin-bottom:8px">
    注：片段边界为系统首次识别到换品的时间，非主播实际换品的精确时刻；商品卡短暂消失不结束片段。</div>`;
  return note + segs.map(s => {
    const range = s.endMs == null
      ? `${fmtMs(s.startMs)}–进行中`
      : `${fmtMs(s.startMs)}–${fmtMs(s.endMs)}`;
    const dur = s.endMs == null ? "进行中" : fmtDur(s.endMs - s.startMs);
    const head = s.product
      ? `<span class="badge" style="background:#e8f5e9;color:#2e7d32">换品</span>
         <b>${esc(s.product.product ? s.product.product.name : (s.product.name || "未知商品"))}</b>
         ${segPriceLabel(s.product.product || s.product) ? `｜${esc(segPriceLabel(s.product.product || s.product))}` : ""}`
      : `<span class="badge" style="background:#f5f5f5;color:#888">未识别商品的时间段</span>`;
    const pu = s.priceUpdates.length
      ? `<div style="margin-top:6px;font-size:12px;color:#1565c0">价格更新：
          ${s.priceUpdates.map(p => {
            const prod = p.product || {};
            return `<span style="margin-right:12px">${fmtMs(p.offsetMs)}｜${esc(segPriceLabel(prod) || "—")}</span>`;
          }).join("")}</div>`
      : "";
    const counts = { transcript: 0, danmaku: 0, visual: 0 };
    for (const x of s.items) { if (counts[x.kind] != null) counts[x.kind]++; }
    const body = s.items.length
      ? s.items.map(x => `<div class="tl-item">${renderItem(x, sessionId)}</div>`).join("")
      : '<div class="nodata">本段无转写/弹幕/画面</div>';
    return `<div class="card" style="border-left:3px solid #2196F3">
      <h3>片段 ${s.index + 1} <span style="font-size:12px;color:#999;font-weight:normal">${range} · 时长 ${dur}</span></h3>
      <div style="margin-bottom:4px">${head}</div>${pu}
      <div style="font-size:12px;color:#999;margin:6px 0">转写 ${counts.transcript} · 弹幕 ${counts.danmaku} · 画面 ${counts.visual}</div>
      ${body}
    </div>`;
  }).join("");
}

function fmtDur(ms) {
  const s = Math.round(ms / 1000);
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}分${s % 60}秒` : `${s}秒`;
}

async function deleteSession(sessionId) {
  if (!confirm(`删除会话 ${sessionId} 的全部数据（含截图）？此操作不可恢复。`)) return;
  try {
    const r = await fetch("/session/delete", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId })
    });
    const data = await r.json();
    if (data.ok) {
      $("main").innerHTML = '<div class="empty-tip">← 选择一场会话查看复盘</div>';
      loadSessions();
    } else {
      alert("删除失败：" + (data.error || "未知错误"));
    }
  } catch (e) {
    alert("删除失败：" + e.message);
  }
}

// TASK-DOM-DIAGNOSTIC-001：诊断报告列表与详情
async function loadDiags() {
  try {
    const r = await fetch("/api/diagnostics");
    const data = await r.json();
    const list = data.list || [];
    if (!list.length) {
      $("diagList").innerHTML = '<div class="empty-tip">暂无诊断报告</div>';
      return;
    }
    $("diagList").innerHTML = list.map(d => `
      <div class="sess" data-diag="${esc(d.id)}">
        <div class="id">${esc(d.id)}</div>
        <div class="meta">${esc(fmtTime(d.savedAt))} · 商品卡 ${d.productFound ? "✓" : "✗"} · 在线人数 ${d.onlineFound ? "✓" : "✗"}</div>
      </div>`).join("");
    document.querySelectorAll("[data-diag]").forEach(el => {
      el.addEventListener("click", () => showDiagDetail(el.dataset.diag));
    });
  } catch (e) {
    $("diagList").innerHTML = '<div class="empty-tip">加载失败</div>';
  }
}

async function showDiagDetail(id) {
  document.querySelectorAll(".sess").forEach(x => x.classList.remove("active"));
  try {
    const r = await fetch("/api/diagnostic?id=" + encodeURIComponent(id));
    const data = await r.json();
    const d = data.diagnostic || {};
    const sec = (title, obj) => `
      <div class="card"><h3>${title}</h3>
      <pre style="white-space:pre-wrap;font-size:12px;background:#f7f7f7;padding:12px;border-radius:6px;overflow:auto">${esc(JSON.stringify(obj, null, 2))}</pre></div>`;
    $("main").innerHTML = `
      <div class="sessinfo">页面诊断 <span class="mono">${esc(id)}</span> · ${esc(fmtTime(d.savedAt))}</div>
      ${sec("讲解商品卡", d.productCard || {})}
      ${sec("在线人数", d.onlineCount || {})}`;
  } catch (e) {
    $("main").innerHTML = '<div class="empty-tip">诊断报告加载失败</div>';
  }
}

// TASK-STORAGE-001：存储管理
function fmtBytes(b) {
  if (b == null) return "—";
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
  if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + " MB";
  return (b / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

let storageCache = null;

async function showStorage() {
  document.querySelectorAll(".sess").forEach(x => x.classList.remove("active"));
  $("main").innerHTML = '<div class="empty-tip">加载中…</div>';
  try {
    const r = await fetch("/api/storage");
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    const st = data.storage;
    storageCache = st;
    const rows = st.sessions.map(s => {
      const dur = (s.startTime && s.endTime)
        ? fmtDur(s.endTime - s.startTime) : (s.active ? "进行中" : "—");
      const status = s.active
        ? '<span class="badge" style="background:#fff3e0;color:#e65100">进行中</span>'
        : '<span class="badge" style="background:#f5f5f5;color:#888">已结束</span>';
      const dis = s.active ? "disabled style='opacity:.4;cursor:not-allowed'" : "";
      return `<tr>
        <td>${esc(fmtTime(s.startTime))}</td>
        <td>${dur}</td>
        <td>${s.frameCount}</td>
        <td>${fmtBytes(s.bytes)}</td>
        <td>${status}</td>
        <td>
          <button data-clear="${esc(s.sessionId)}" ${dis}>清截图</button>
          <button data-delone="${esc(s.sessionId)}" ${dis} style="color:#d32f2f">删整场</button>
        </td>
      </tr>`;
    }).join("");
    $("main").innerHTML = `
      <div class="card"><h3>存储管理 <span style="font-size:11px;color:#999;font-weight:normal">本机数据 · 不上传</span></h3>
        <div class="kv">
          <span>会话：<b>${st.sessionCount}</b> 场</span>
          <span>截图：<b>${st.frameCount}</b> 张</span>
          <span>总占用：<b>${fmtBytes(st.totalBytes)}</b></span>
          <span>截图占用：<b>${fmtBytes(st.frameBytes)}</b></span>
          <span>最早：<b>${st.earliest ? esc(fmtTime(st.earliest)) : "—"}</b></span>
          <span>最新：<b>${st.latest ? esc(fmtTime(st.latest)) : "—"}</b></span>
        </div>
      </div>
      <div class="card"><h3>批量清理</h3>
        <div style="font-size:13px;margin-bottom:8px">
          删除 <input type="date" id="batchBefore" style="padding:4px"> 之前开始的<strong>已结束</strong>会话
          <button id="btnBatchGo" style="margin-left:8px">清理</button>
        </div>
        <div id="batchHint" style="font-size:12px;color:#999">仅删除已结束会话；进行中的会话不会被删除；操作前会二次确认。</div>
      </div>
      <div class="card"><h3>会话明细</h3>
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          <tr style="color:#999;text-align:left"><th>开始时间</th><th>时长</th><th>截图</th><th>占用</th><th>状态</th><th>操作</th></tr>
          ${rows || '<tr><td colspan="6" class="nodata">暂无会话</td></tr>'}
        </table>
      </div>`;
    // 批量清理：先展示"将删除 N 场、预计释放 X MB"，二次确认后执行
    $("btnBatchGo").addEventListener("click", async () => {
      const dv = $("batchBefore").value;
      if (!dv) { $("batchHint").textContent = "请先选择日期。"; return; }
      const before = new Date(dv + "T00:00:00").getTime();
      const targets = st.sessions.filter(s => !s.active && s.endTime && s.startTime < before);
      if (!targets.length) { $("batchHint").textContent = "所选日期之前没有可删除的已结束会话。"; return; }
      const freed = targets.reduce((a, s) => a + s.bytes, 0);
      $("batchHint").innerHTML =
        `将删除 <b>${targets.length}</b> 场、预计释放 <b>${fmtBytes(freed)}</b>。` +
        `<button id="btnBatchConfirm" style="margin-left:8px;color:#d32f2f">确认删除</button>`;
      $("btnBatchConfirm").addEventListener("click", async () => {
        if (!confirm(`确定删除 ${targets.length} 场已结束会话吗？此操作不可恢复。`)) return; // 取消则不改变任何数据
        const rr = await fetch("/sessions/batch-delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ before })
        });
        const dd = await rr.json();
        if (dd.ok) {
          alert(`已删除 ${dd.deleted} 场，释放 ${fmtBytes(dd.freedBytes)}。`);
          loadSessions(); showStorage();
        } else {
          alert("批量删除失败：" + (dd.error || "未知错误"));
        }
      });
    });
    // 单场操作
    document.querySelectorAll("[data-clear]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (btn.disabled) return;
        const id = btn.dataset.clear;
        if (!confirm(`清除会话 ${id} 的全部截图吗？转写、弹幕、商品与趋势记录会保留。`)) return;
        const rr = await fetch("/session/clear-frames", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: id })
        });
        const dd = await rr.json();
        if (dd.ok) { alert(`已清除 ${dd.clearedFrames} 张截图。`); loadSessions(); showStorage(); }
        else alert("清理失败：" + (dd.error || "未知错误"));
      });
    });
    document.querySelectorAll("[data-delone]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (btn.disabled) return;
        const id = btn.dataset.delone;
        if (!confirm(`删除会话 ${id} 的全部数据（含截图）？此操作不可恢复。`)) return;
        const rr = await fetch("/session/delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: id })
        });
        const dd = await rr.json();
        if (dd.ok) { loadSessions(); showStorage(); }
        else alert("删除失败：" + (dd.error || "未知错误"));
      });
    });
  } catch (e) {
    $("main").innerHTML = '<div class="empty-tip">存储信息加载失败：' + esc(e.message) + "</div>";
  }
}

// TASK-UI-003：从时间轴数据构建四轨道数据
function buildTimelineData(tlWithDelta, info, sessionId) {
  const durationMs = (info.endTime && info.startTime)
    ? info.endTime - info.startTime
    : (info.startTime ? Date.now() - info.startTime : 60000);
  // 商品区间：复用分段规则
  const segs = LiveSegments.buildSegments(
    tlWithDelta.map(x => ({ kind: x.kind, at: x.at, data: x.data })),
    info
  );
  const products = segs.map(s => {
    const prod = s.product ? (s.product.product || s.product) : null;
    return {
      startMs: s.startMs, endMs: s.endMs == null ? durationMs : s.endMs,
      name: prod ? (prod.name || "未知商品") : "未识别商品的时间段",
      priceText: prod ? (prod.priceText || (prod.price ? "¥" + prod.price : "")) : "",
      type: prod ? "product" : "unrecognized",
      seg: s
    };
  });
  const prices = tlWithDelta
    .filter(x => x.kind === "product" && x.data && x.data.type === "price_update")
    .map(x => ({ atMs: x.at, priceText: (x.data.product && x.data.product.priceText) || "", name: (x.data.product && x.data.product.name) || "" }));
  const online = tlWithDelta
    .filter(x => x.kind === "visual" && x.data && x.data.metrics && x.data.metrics.online != null)
    .map(x => ({ atMs: x.at, online: x.data.metrics.online }));
  const shots = tlWithDelta
    .filter(x => x.kind === "visual" && x.data && x.data.framePath)
    .map(x => ({
      atMs: x.at,
      file: x.data.framePath.split("/").pop(),
      sessionId
    }));
  const switches = tlWithDelta
    .filter(x => x.kind === "product" && x.data && x.data.type !== "price_update")
    .map(x => ({ atMs: x.at, name: (x.data.product && x.data.product.name) || "" }));
  return { durationMs, products, prices, online, shots, switches };
}

let tlInstance = null;
let tlData = null;
let tlRange = null; // {start, end} 当前选中范围
let tlEvPage = 0;
const TL_PAGE_SIZE = 50;

function initOverview(sessionId, tlWithDelta, info) {
  const cv = $("tlCanvas");
  if (!cv) return;
  if (typeof Timeline === "undefined") {
    // server.js 未重启（/timeline.js 路由缺失）时的中文提示，不留空白
    cv.outerHTML = '<div class="nodata" style="padding:24px;text-align:center">时间轴组件未加载：本地服务版本过旧，请重启服务（Ctrl+C 后重新 npm start）。</div>';
    return;
  }
  tlData = buildTimelineData(tlWithDelta, info, sessionId);
  tlInstance = new Timeline(cv);
  tlInstance.setData(tlData);
  tlInstance.onRangeSelect = (r) => {
    tlRange = r;
    tlEvPage = 0;
    renderDetailRange(sessionId, tlWithDelta);
  };
  tlInstance.onPointClick = (atMs) => {
    // 点击时间轴空白处：展示该时间点前后 2 分钟的话术与证据
    tlRange = { start: Math.max(0, atMs - 120000), end: atMs + 120000 };
    tlInstance.setSelection(tlRange.start, tlRange.end);
    tlInstance.setCursor(atMs);
    tlEvPage = 0;
    renderDetailRange(sessionId, tlWithDelta);
  };
  tlInstance.onNodeClick = (hit) => {
    if (hit.type === "product") {
      const p = hit.data;
      tlRange = { start: Math.round(p.startMs), end: Math.round(p.endMs) };
      tlInstance.setSelection(tlRange.start, tlRange.end);
      tlInstance.setCursor(tlRange.start);
    } else if (hit.type === "price") {
      const at = Math.round(hit.data.atMs);
      tlInstance.setCursor(at);
      tlRange = { start: Math.max(0, at - 60000), end: at + 60000 };
      tlInstance.setSelection(tlRange.start, tlRange.end);
    } else if (hit.type === "shot") {
      openShotLightbox(hit.data.sessionId, hit.data.file, hit.data.atMs);
      return;
    }
    tlEvPage = 0;
    renderDetailRange(sessionId, tlWithDelta);
  };
  // 快捷视图
  document.querySelectorAll("[data-qv]").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-qv]").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      tlInstance.quickView(b.dataset.qv);
    });
  });
  // 搜索
  const doSearch = () => {
    const kw = $("tlSearch").value.trim();
    const box = $("tlSearchResults");
    if (!kw) { box.style.display = "none"; return; }
    const hits = tlWithDelta.filter(x =>
      (x.kind === "transcript" || x.kind === "danmaku") &&
      x.data && typeof x.data.text === "string" && x.data.text.includes(kw)
    ).slice(0, 50);
    box.innerHTML = hits.length
      ? hits.map((x, i) => `<div class="search-match" data-i="${i}">
          <span class="t">${fmtMs(x.at)}</span>${esc(x.data.text.slice(0, 60))}</div>`).join("")
      : '<div class="nodata" style="padding:8px">无匹配</div>';
    box.style.display = "block";
    box.querySelectorAll(".search-match").forEach(el => {
      el.addEventListener("click", () => {
        const x = hits[+el.dataset.i];
        tlInstance.setCursor(x.at);
        tlRange = { start: Math.max(0, x.at - 60000), end: x.at + 60000 };
        tlInstance.setSelection(tlRange.start, tlRange.end);
        tlEvPage = 0;
        renderDetailRange(sessionId, tlWithDelta);
        box.style.display = "none";
      });
    });
  };
  $("tlSearchGo").addEventListener("click", doSearch);
  $("tlSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
  // 上一个/下一个换品
  const jumpProduct = (dir) => {
    const sw = tlData.switches;
    if (!sw.length) return;
    const cur = tlInstance.cursor != null ? tlInstance.cursor : (tlRange ? tlRange.start : 0);
    let target = null;
    if (dir > 0) target = sw.find(s => s.atMs > cur + 1000) || sw[0];
    else target = sw.slice().reverse().find(s => s.atMs < cur - 1000) || sw[sw.length - 1];
    if (target) {
      tlInstance.setCursor(target.atMs);
      tlRange = { start: Math.max(0, target.atMs - 60000), end: target.atMs + 5 * 60000 };
      tlInstance.setSelection(tlRange.start, tlRange.end);
      tlEvPage = 0;
      renderDetailRange(sessionId, tlWithDelta);
    }
  };
  $("tlPrevProduct").addEventListener("click", () => jumpProduct(-1));
  $("tlNextProduct").addEventListener("click", () => jumpProduct(1));
  // 截图放大
  $("shotLightboxBack").addEventListener("click", () => {
    $("shotLightbox").style.display = "none";
  });
  $("shotLightbox").addEventListener("click", (e) => {
    if (e.target.id === "shotLightbox") $("shotLightbox").style.display = "none";
  });

  // 初次打开：全场总览 + 最新片段（进行中）/ 首个片段（已结束）
  const segs = tlData.products;
  let initSeg = null;
  if (!info.endTime) initSeg = segs[segs.length - 1]; // 进行中：最新片段
  else initSeg = segs[0]; // 已结束：首个片段
  if (initSeg) {
    tlRange = { start: Math.round(initSeg.startMs), end: Math.round(initSeg.endMs) };
    tlInstance.setSelection(tlRange.start, tlRange.end);
    tlInstance.setCursor(tlRange.start);
  }
  renderDetailRange(sessionId, tlWithDelta);
  // 窗口变化时重绘
  window.addEventListener("resize", () => tlInstance && tlInstance.render());
}

function openShotLightbox(sessionId, file, atMs) {
  const img = $("shotLightboxImg");
  img.src = `/api/frame?sessionId=${encodeURIComponent(sessionId)}&file=${encodeURIComponent(file)}`;
  $("shotLightbox").style.display = "flex";
  if (tlInstance) tlInstance.setCursor(atMs); // 返回时保持原定位
}

// 渲染选中范围内的证据（分页，避免一次性渲染大量转写/弹幕）
function renderDetailRange(sessionId, tlWithDelta) {
  if (!tlRange) {
    $("tlEvidence").innerHTML = '<div class="nodata">在上方时间轴框选范围（Shift+拖拽），查看该段证据</div>';
    return;
  }
  const inRange = tlWithDelta.filter(x => x.at >= tlRange.start && x.at < tlRange.end);
  $("tlRangeLabel").textContent = `（${fmtMs(tlRange.start)} – ${fmtMs(tlRange.end)}）`;

  // 左：原话与弹幕（分页）
  const ev = inRange.filter(x => x.kind === "transcript" || x.kind === "danmaku");
  const shown = ev.slice(0, (tlEvPage + 1) * TL_PAGE_SIZE);
  $("tlEvidence").innerHTML = shown.length
    ? shown.map(x => `<div class="tl-item">${renderItem(x, sessionId)}</div>`).join("")
    : '<div class="nodata">本范围无转写/弹幕</div>';
  $("tlMoreWrap").style.display = ev.length > shown.length ? "block" : "none";
  $("tlMore").onclick = () => { tlEvPage++; renderDetailRange(sessionId, tlWithDelta); };
  $("tlMore").textContent = `加载更多（剩余 ${ev.length - shown.length} 条）`;

  // 右：商品
  const prods = inRange.filter(x => x.kind === "product");
  $("tlProducts").innerHTML = prods.length
    ? prods.map(x => `<div class="tl-item">${renderProduct(x.data)}</div>`).join("")
    : '<div class="nodata">本范围无商品</div>';

  // 右：画面
  const shots = inRange.filter(x => x.kind === "visual" && x.data && x.data.framePath);
  $("tlShots").innerHTML = shots.length
    ? shots.map(x => {
        const file = x.data.framePath.split("/").pop();
        return `<span class="shot-thumb" data-file="${esc(file)}" data-at="${x.at}">
          <img loading="lazy" src="/api/frame?sessionId=${encodeURIComponent(sessionId)}&file=${encodeURIComponent(file)}" alt="${fmtMs(x.at)}"></span>`;
      }).join("")
    : '<div class="nodata">本范围无截图</div>';
  document.querySelectorAll(".shot-thumb").forEach(el => {
    el.addEventListener("click", () => openShotLightbox(sessionId, el.dataset.file, +el.dataset.at));
  });

  // 右：分析（TASK-AI-002）
  renderAnalysisPanel(sessionId);
}

// ============ TASK-AI-002：分析面板 ============
let analyzing = false; // 防重复点击
let currentPreview = null;

function renderAnalysisPanel(sessionId) {
  const rangeLabel = tlRange ? `${fmtMs(tlRange.start)} – ${fmtMs(tlRange.end)}` : "未选范围";
  $("tlAnalysis").innerHTML = `
    <div style="font-size:12px;color:#666;margin-bottom:6px">范围：${esc(rangeLabel)}</div>
    <button id="tlAnalyzeBtn" ${!tlRange || analyzing ? "disabled" : ""}
      style="padding:8px 20px;font-size:13px;border:none;border-radius:10px;cursor:${!tlRange || analyzing ? "not-allowed" : "pointer"};
      background:${!tlRange || analyzing ? "#f0f0f0" : "#2196F3"};color:${!tlRange || analyzing ? "#999" : "#fff"}">
      ${analyzing ? "分析中…" : "分析这段"}</button>
    <div id="tlAnalysisList" style="margin-top:8px"></div>
    <div id="tlAnalysisResult" style="margin-top:8px"></div>`;
  const btn = $("tlAnalyzeBtn");
  if (btn && tlRange && !analyzing) btn.addEventListener("click", () => doAnalysisPreview(sessionId));
  loadAnalysisList(sessionId);
}

async function loadAnalysisList(sessionId) {
  try {
    const r = await fetch(`/api/analysis?sessionId=${encodeURIComponent(sessionId)}`);
    const d = await r.json();
    if (!d.ok || !d.list.length) return;
    $("tlAnalysisList").innerHTML = `<div style="font-size:12px;color:#999;margin:6px 0">历史分析（${d.list.length}）</div>` +
      d.list.map(a => `<div class="search-match" data-aid="${esc(a.analysisId)}">
        <span class="t">${esc(a.rangeLabel)}</span>${a.mock ? '<span class="badge" style="background:#fff3e0;color:#e65100">MOCK</span>' : ""}
        ${esc(a.summary.slice(0, 40))}…</div>`).join("");
    $("tlAnalysisList").querySelectorAll(".search-match").forEach(el => {
      el.addEventListener("click", () => loadAnalysisDetail(sessionId, el.dataset.aid));
    });
  } catch (e) { /* 静默 */ }
}

async function loadAnalysisDetail(sessionId, analysisId) {
  try {
    const r = await fetch(`/api/analysis/detail?sessionId=${encodeURIComponent(sessionId)}&analysisId=${encodeURIComponent(analysisId)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    renderAnalysisResult(sessionId, d.analysis, d.feedback);
  } catch (e) {
    $("tlAnalysisResult").innerHTML = `<div class="nodata">加载失败：${esc(e.message)}</div>`;
  }
}

async function doAnalysisPreview(sessionId) {
  if (analyzing || !tlRange) return;
  analyzing = true;
  renderAnalysisPanel(sessionId);
  try {
    const r = await fetch("/api/analysis/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, rangeStartMs: tlRange.start, rangeEndMs: tlRange.end }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    currentPreview = d.preview;
    const p = d.preview;
    if (!p.hasAnalyzable) {
      $("tlAnalysisResult").innerHTML = `<div class="nodata">本范围无转写、弹幕、商品、在线数据可分析，不会调用模型。</div>`;
      analyzing = false;
      renderAnalysisPanel(sessionId);
      return;
    }
    const missingTxt = p.missing.length ? `缺失：${p.missing.join("、")}` : "数据齐全";
    const cfgTxt = d.secretsConfigured ? "已配置分析 API" : (d.testMode ? "测试模式（MOCK，不计费）" : "未配置分析 API（将使用 MOCK，不计费）");
    $("tlAnalysisResult").innerHTML = `
      <div class="card" style="background:#f8fbff;border:1px solid #e3f2fd;margin:0">
        <div style="font-size:13px;margin-bottom:6px"><b>将发送给 AI 的数据</b>（${esc(p.range.label)}）</div>
        <div style="font-size:12px;color:#555;line-height:1.8">
          转写 ${p.counts.transcript} 条 · 弹幕 ${p.counts.danmaku} 条 · 商品事件 ${p.counts.product} 个 ·
          在线采样 ${p.counts.online} 个${p.counts.contextProduct ? " · 含起点商品上下文" : ""}<br>
          ${esc(missingTxt)}<br>
          <span style="color:#999">截图不发送；弹幕用户名不发送</span><br>
          ${esc(cfgTxt)}
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button id="tlConfirmAnalyze" style="padding:8px 20px;font-size:13px;border:none;border-radius:10px;background:#2196F3;color:#fff;cursor:pointer">确认分析</button>
          <button id="tlCancelAnalyze" style="padding:8px 16px;font-size:13px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer">取消</button>
        </div>
      </div>`;
    $("tlConfirmAnalyze").addEventListener("click", () => doAnalyze(sessionId, p.evidenceHash));
    $("tlCancelAnalyze").addEventListener("click", () => { analyzing = false; renderAnalysisPanel(sessionId); });
  } catch (e) {
    $("tlAnalysisResult").innerHTML = `<div class="nodata">预览失败：${esc(e.message)}</div>`;
    analyzing = false;
    renderAnalysisPanel(sessionId);
  }
}

async function doAnalyze(sessionId, evidenceHash) {
  $("tlAnalysisResult").innerHTML = `<div class="nodata">分析中，请稍候…（30 秒超时）</div>`;
  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, rangeStartMs: tlRange.start, rangeEndMs: tlRange.end, evidenceHash }),
    });
    const d = await r.json();
    if (!d.ok) {
      if (d.code === "EVIDENCE_CHANGED") {
        $("tlAnalysisResult").innerHTML = `<div class="nodata">证据已变化，请<button id="tlRePreview" style="margin:0 4px;padding:4px 12px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">重新确认</button>后再分析。</div>`;
        $("tlRePreview").addEventListener("click", () => doAnalysisPreview(sessionId));
      } else {
        $("tlAnalysisResult").innerHTML = `<div class="nodata">分析失败：${esc(d.error)}
          <button id="tlRetry" style="margin-left:8px;padding:4px 12px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">重试</button></div>`;
        $("tlRetry").addEventListener("click", () => doAnalysisPreview(sessionId));
      }
      analyzing = false;
      renderAnalysisPanel(sessionId);
      // 保留结果区，只刷新按钮
      return;
    }
    analyzing = false;
    renderAnalysisPanel(sessionId);
    renderAnalysisResult(sessionId, d.analysis, []);
    loadAnalysisList(sessionId);
  } catch (e) {
    $("tlAnalysisResult").innerHTML = `<div class="nodata">请求失败：${esc(e.message)}</div>`;
    analyzing = false;
    renderAnalysisPanel(sessionId);
  }
}

// 证据 ref → atMs 映射（用于点击定位）
let refAtMsMap = {};

function renderAnalysisResult(sessionId, a, feedback) {
  const r = a.result || {};
  refAtMsMap = {};
  (r.evidence || []).forEach(ev => { if (ev.ref && ev.atMs != null) refAtMsMap[ev.ref] = ev.atMs; });
  const evHtml = (r.evidence || []).map(ev =>
    `<div class="search-match" data-ref="${esc(ev.ref)}">
      <span class="t">${esc(ev.ref)}</span>${esc(ev.quote || "")}</div>`).join("");
  const sugHtml = (r.suggestions || []).map(s =>
    `<div style="font-size:13px;margin-bottom:8px">• ${esc(s.text)}
      ${(s.basedOn || []).map(b => `<span class="t" style="color:#999;font-size:11px;margin-left:6px">${esc(b)}</span>`).join("")}</div>`).join("");
  const fbHtml = (feedback || []).map(f =>
    `<div style="font-size:12px;color:#666">【${f.type === "useful" ? "有用" : "不准确"}】${esc(f.note || "")} <span style="color:#ccc">${esc((f.at || "").slice(0, 16))}</span></div>`).join("");
  $("tlAnalysisResult").innerHTML = `
    <div class="card" style="background:#fff;border:1px solid #e8e8e8;margin:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="font-size:14px">AI 分析</b>
        ${a.mock ? '<span class="badge" style="background:#fff3e0;color:#e65100">MOCK</span>' : ""}
        ${a.cached ? '<span class="badge" style="background:#e8f5e9;color:#2e7d32">缓存</span>' : ""}
        <span style="font-size:11px;color:#999">${esc(a.rangeLabel)} · ${esc(a.model)} · ${esc(a.ruleVersion)}</span>
      </div>
      <h4 style="margin:10px 0 4px">这段发生了什么</h4>
      <div style="font-size:13px;line-height:1.7">${esc(r.summary || "—")}</div>
      <h4 style="margin:10px 0 4px">原始证据（点击定位）</h4>
      <div>${evHtml || '<div class="nodata">无</div>'}</div>
      <h4 style="margin:10px 0 4px">建议怎么改</h4>
      <div>${sugHtml || '<div class="nodata">无</div>'}</div>
      <h4 style="margin:10px 0 4px">下次怎么验证</h4>
      <div style="font-size:13px;line-height:1.7">${esc(r.verification || "—")}</div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="fb-btn" data-t="useful" style="padding:5px 14px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">有用</button>
        <button class="fb-btn" data-t="inaccurate" style="padding:5px 14px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">不准确</button>
        <input id="fbNote" type="text" placeholder="备注（可选）" style="padding:5px 8px;font-size:12px;border:1px solid #ddd;border-radius:8px;width:140px">
      </div>
      <div id="fbList" style="margin-top:6px">${fbHtml}</div>
    </div>`;
  $("tlAnalysisResult").querySelectorAll("[data-ref]").forEach(el => {
    el.addEventListener("click", () => {
      const atMs = refAtMsMap[el.dataset.ref];
      if (atMs != null && tlInstance) {
        tlInstance.setCursor(atMs);
        tlRange = { start: Math.max(0, atMs - 60000), end: atMs + 60000 };
        tlInstance.setSelection(tlRange.start, tlRange.end);
        tlEvPage = 0;
        // 重新加载当前会话详情的证据区（不整页刷新）
        const sid = currentSessionId;
        fetch(`/api/session?id=${encodeURIComponent(sid)}`).then(x => x.json()).then(d => {
          if (d.ok) {
            const tl = (d.timeline || []).filter(x => showKind === "all" || x.kind === showKind);
            renderDetailRange(sid, tl);
            renderAnalysisPanel(sid);
            renderAnalysisResult(sid, a, feedback);
          }
        });
      }
    });
  });
  $("tlAnalysisResult").querySelectorAll(".fb-btn").forEach(b => {
    b.addEventListener("click", async () => {
      const note = $("fbNote") ? $("fbNote").value.trim() : "";
      try {
        const rr = await fetch("/api/analysis/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, analysisId: a.analysisId, type: b.dataset.t, note }),
        });
        const dd = await rr.json();
        if (!dd.ok) throw new Error(dd.error);
        loadAnalysisDetail(sessionId, a.analysisId); // 刷新反馈列表
      } catch (e) {
        alert("反馈保存失败：" + e.message);
      }
    });
  });
}

async function loadDetail(sessionId) {
  $("main").innerHTML = '<div class="empty-tip">加载中…</div>';
  try {
    const r = await fetch("/api/session?id=" + encodeURIComponent(sessionId));
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    const info = data.info || {};
    const snap = info.profileSnapshot || {};
    const dur = info.endTime && info.startTime
      ? Math.round((info.endTime - info.startTime) / 1000) + "s" : "进行中";
    const tl = (data.timeline || []).filter(x =>
      showKind === "all" || x.kind === showKind);

    // 在线显示净变化：相对上一条有数值的快照（Codex 评审：只展示差值，不做因果/进出推断）
    let lastOnline = null;
    const tlWithDelta = tl.map(x => {
      let delta = null;
      if (x.kind === "visual") {
        const cur = x.data && x.data.metrics ? x.data.metrics.online : null;
        if (cur != null && lastOnline != null) delta = cur - lastOnline;
        if (cur != null) lastOnline = cur;
      }
      return { ...x, _delta: delta };
    });

    $("main").innerHTML = `
      <div class="card" style="padding:12px 16px">
        <div style="font-size:13px;color:#333;display:flex;gap:14px;flex-wrap:wrap;align-items:center">
          ${!info.endTime ? '<span style="color:#4CAF50"><span class="live-dot"></span>正在监听</span>' : ""}
          <span>开始 <b>${esc(fmtTime(info.startTime))}</b></span>
          <span>时长 <b>${dur}</b></span>
          <span>转写 <b>${data.transcriptCount}</b></span>
          <span>弹幕 <b>${data.danmakuCount}</b></span>
          <span>换品 <b>${tl.filter(x => x.kind === "product" && x.data && x.data.type !== "price_update").length}</b></span>
          <span>截图 <b>${tl.filter(x => x.kind === "visual" && x.data && x.data.framePath).length}</b></span>
          <span style="color:#999">档案 ${esc(snap.profileName || "通用")}</span>
        </div>
        ${(snap.sessionKeywords && snap.sessionKeywords.length)
          ? `<div style="margin-top:6px;font-size:12px;color:#666">本场关键词：${esc(snap.sessionKeywords.join("，"))}</div>` : ""}
      </div>
      <div class="card">
        <div class="toolbar">
          <h3 style="margin:0">时间轴</h3>
          <div class="seg-toggle" style="display:inline-flex;border:1px solid #ddd;border-radius:4px;overflow:hidden">
            <button id="viewOverview" class="seg-btn">时间轴总览</button>
            <button id="viewTimeline" class="seg-btn">完整时间轴</button>
          </div>
          <label>筛选</label>
          <select id="kindFilter">
            <option value="all">全部</option>
            <option value="transcript">只看转写</option>
            <option value="danmaku">只看弹幕</option>
            <option value="visual">只看画面</option>
            <option value="product">只看换品/价格更新</option>
          </select>
          <span style="font-size:12px;color:#999">${tl.length} 条</span>
        </div>
        <div id="tlOverview" style="display:${viewMode === "overview" ? "block" : "none"}">
          <div class="tl-controls">
            <button data-qv="full" class="active">全场</button>
            <button data-qv="30m">30分钟</button>
            <button data-qv="10m">10分钟</button>
            <input type="text" id="tlSearch" placeholder="搜索转写/弹幕关键词">
            <button id="tlSearchGo">搜索</button>
            <button id="tlPrevProduct">↑ 上一个换品</button>
            <button id="tlNextProduct">下一个换品 ↓</button>
            <span class="tl-hint">拖拽平移 · 滚轮缩放 · 点击看该处前后2分钟 · Shift+拖拽框选范围 · 点击节点定位</span>
          </div>
          <canvas id="tlCanvas"></canvas>
          <div id="tlSearchResults" style="display:none;max-height:160px;overflow-y:auto;border:1px solid #eee;border-radius:6px;margin-top:8px"></div>
          <div class="tl-detail">
            <div class="tl-left">
              <h4>原话与弹幕 <span id="tlRangeLabel" style="font-size:11px;color:#999;font-weight:normal"></span></h4>
              <div class="tl-ev" id="tlEvidence"></div>
              <div class="tl-more" id="tlMoreWrap" style="display:none"><button id="tlMore">加载更多</button></div>
            </div>
            <div class="tl-right">
              <h4>商品</h4>
              <div id="tlProducts"><div class="nodata">本范围无商品</div></div>
              <h4>画面</h4>
              <div id="tlShots"><div class="nodata">本范围无截图</div></div>
              <h4>分析</h4>
              <div id="tlAnalysis">
                <div class="nodata">尚未分析</div>
                <button id="tlAnalyzeBtn" disabled title="AI 分析即将上线（TASK-AI-002）"
                  style="margin-top:6px;padding:6px 16px;font-size:13px;border:1px solid #ddd;border-radius:6px;background:#f5f5f5;color:#999;cursor:not-allowed">分析这段</button>
              </div>
            </div>
          </div>
        </div>
        <div id="tl">
          ${viewMode === "timeline"
            ? (tl.length ? tlWithDelta.map(x => `<div class="tl-item">${renderItem(x, sessionId)}</div>`).join("")
              : '<div class="nodata">暂无转写与弹幕</div>')
            : ""}
        </div>
      </div>
      <div id="shotLightbox">
        <img id="shotLightboxImg" src="" alt="截图放大">
        <button id="shotLightboxBack">返回原定位</button>
      </div>
      <div class="card">
        <h3 class="collapse-toggle" style="cursor:pointer;user-select:none">画面 / 趋势
          <span style="font-size:11px;color:#999;font-weight:normal">约5分钟/张（首张为启动时立即采样）</span>
          <span class="chev" style="float:right;color:#999">▸</span></h3>
        <div class="collapse-body" style="display:none">
          <div id="tlVisual">
            ${tlWithDelta.filter(x => x.kind === "visual").length
              ? tlWithDelta.filter(x => x.kind === "visual").map(x =>
                `<div class="tl-item">${renderVisual(x.data, sessionId, x._delta)}</div>`).join("")
              : '<div class="nodata">暂无数据</div>'}
          </div>
        </div>
      </div>
      <div class="card">
        <h3 class="collapse-toggle" style="cursor:pointer;user-select:none">流量 / 成交
          <span class="chev" style="float:right;color:#999">▸</span></h3>
        <div class="collapse-body" style="display:none"><div class="nodata">暂无数据</div></div>
      </div>`;
    // 折叠卡片：点击标题展开/收起
    document.querySelectorAll(".collapse-toggle").forEach(h => {
      h.addEventListener("click", () => {
        const body = h.nextElementSibling;
        const open = body.style.display !== "none";
        body.style.display = open ? "none" : "block";
        const chev = h.querySelector(".chev");
        if (chev) chev.textContent = open ? "▸" : "▾";
      });
    });
    const kf = $("kindFilter");
    kf.value = showKind;
    // 筛选只刷新时间轴区域，保持滚动位置（TASK-UI-003v2）
    kf.addEventListener("change", () => {
      showKind = kf.value;
      const st = window.scrollY;
      loadDetail(sessionId).then(() => requestAnimationFrame(() => window.scrollTo(0, st)));
    });
    // TASK-UI-003：时间轴总览 / 完整时间轴切换
    const vo = $("viewOverview"), vt = $("viewTimeline");
    const paintViewBtns = () => {
      for (const [btn, mode] of [[vo, "overview"], [vt, "timeline"]]) {
        btn.style.cssText = "padding:4px 10px;font-size:12px;border:none;cursor:pointer;" +
          (viewMode === mode ? "background:#2196F3;color:#fff" : "background:#fff;color:#333");
      }
      $("tlOverview").style.display = viewMode === "overview" ? "block" : "none";
    };
    paintViewBtns();
    vo.addEventListener("click", () => { viewMode = "overview"; paintViewBtns(); initOverview(sessionId, tlWithDelta, info); });
    vt.addEventListener("click", () => { viewMode = "timeline"; loadDetail(sessionId); });
    if (viewMode === "overview") initOverview(sessionId, tlWithDelta, info);
  } catch (e) {
    $("main").innerHTML = '<div class="empty-tip">加载失败：' + esc(e.message) + "</div>";
  }
}

loadSessions();
loadDiags();
document.querySelectorAll(".nav-btn").forEach(b => {
  b.addEventListener("click", () => switchNav(b.dataset.nav));
});
</script>
</body>
</html>
